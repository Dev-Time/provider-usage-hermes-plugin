name: nanogpt-usage
description: Shows NanoGPT subscription quota usage (daily/weekly input tokens, images) as a footer on gateway messages
version: 0.1.0
author: Dev-Time
license: MIT
hooks:
  - transform_llm_output
provides_hooks:
  - transform_llm_output
provides_middleware:
  - llm_request
requires_env:
  - name: NANOGPT_API_KEY
    description: NanoGPT API key (the same key you use for the nano-gpt provider)
    url: https://nano-gpt.com/api
    secret: true
