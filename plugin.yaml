name: provider-usage
description: Shows NanoGPT and OpenCode Go subscription usage as a footer on gateway messages
version: 0.1.0
author: Dev-Time
license: MIT
hooks:
  - transform_llm_output
provides_hooks:
  - transform_llm_output
provides_middleware:
  - llm_request
requires_env:
  - name: NANOGPT_API_KEY
    description: NanoGPT API key (its line is omitted when unset)
    url: https://nano-gpt.com/api
    secret: true
  - name: OPENCODE_GO_API_KEY
    description: OpenCode Go API key (its line is omitted when unset)
    url: https://opencode.ai/zen
    secret: true
